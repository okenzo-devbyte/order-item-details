<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Intelligence — ระบบค้นหาข้อมูลลูกค้าและกลุ่มสินค้า</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Header / Navigation Bar -->
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="/" class="brand-link">
        <div class="brand-icon">🏢</div>
        <span>Customer Intelligence</span>
      </a>
      <div class="topbar-right">
        <span class="role-badge" id="role-badge" hidden></span>
        <a href="/admin.html" class="btn btn-secondary btn-sm" id="admin-link" hidden>⚙️ จัดการข้อมูล</a>
        <button class="btn btn-secondary btn-sm" id="logout-btn">ออกจากระบบ</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Executive KPI Overview Banner -->
    <section class="kpi-grid" id="kpi-banner">
      <div class="kpi-card">
        <div class="kpi-info">
          <h4>ลูกค้าทั้งหมด</h4>
          <div class="kpi-value" id="kpi-customers">—</div>
          <div class="kpi-sub">จากฐานข้อมูลคำสั่งซื้อ</div>
        </div>
        <div class="kpi-icon-wrap kpi-icon-indigo">👥</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-info">
          <h4>คำสั่งซื้อสะสม</h4>
          <div class="kpi-value" id="kpi-orders">—</div>
          <div class="kpi-sub">คำสั่งซื้อทั้งหมด</div>
        </div>
        <div class="kpi-icon-wrap kpi-icon-emerald">📦</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-info">
          <h4>Item สินค้า</h4>
          <div class="kpi-value" id="kpi-items">—</div>
          <div class="kpi-sub">รายการสินค้าทั้งหมด</div>
        </div>
        <div class="kpi-icon-wrap kpi-icon-amber">🏷️</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-info">
          <h4>อัปเดตข้อมูลล่าสุด</h4>
          <div class="kpi-value" id="kpi-last-import" style="font-size: 18px; margin-top: 6px;">—</div>
          <div class="kpi-sub">นำเข้าไฟล์ Excel</div>
        </div>
        <div class="kpi-icon-wrap kpi-icon-blue">🕒</div>
      </div>
    </section>

    <!-- Customer Search Card -->
    <section class="search-box-card" id="search-section">
      <div class="search-header-title">
        <h1>🔍 ค้นหาข้อมูลลูกค้า</h1>
        <p>ค้นหาประวัติการซื้อ และรายการสินค้าที่ลูกค้าเคยสั่งซื้อ</p>
      </div>

      <div class="search-input-wrapper">
        <span class="search-icon">🔎</span>
        <input 
          id="search-input" 
          type="search" 
          class="main-search-input" 
          placeholder="พิมพ์ชื่อลูกค้าเพื่อค้นหาทันที..." 
          autocomplete="off" 
          autofocus
        >
        <button id="search-clear" class="search-clear-btn" title="ล้างการค้นหา">✕</button>
      </div>
    </section>

    <!-- Results Area -->
    <div id="results-meta-bar" class="results-header-bar" hidden>
      <div class="results-count" id="results-count">ผลการค้นหา</div>
    </div>

    <section id="results" class="results" aria-live="polite"></section>
    <div id="pagination" class="pagination" hidden></div>
  </main>

  <script src="/vendor/xlsx.full.min.js"></script>
  <script type="module" src="/js/index.js"></script>
</body>
</html>
